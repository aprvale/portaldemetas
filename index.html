<style>

  table.team-table td.pctcell.bad{color:var(--danger);font-weight:600;}

  .month-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px;}
  .month-cell{min-width:0;}
  .month-cell button{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:8px 4px;border-radius:8px;cursor:pointer;font-family:'Oswald',sans-serif;font-weight:500;}
  .month-cell button.active{background:var(--red);border-color:var(--red);color:#fff;}
  .month-cell.empty{visibility:hidden;}
</style>

      ]},
      { key:'cotasfat', label:'Faturamento · Cotas', cols:[
        {key:'meta',label:'Meta'},{key:'real',label:'Real'},{key:'pct',label:'%',percent:true}
      ]},
      { key:'adimplencia', label:'Adimplência', cols:[
        {key:'meta',label:'Meta'},{key:'venda',label:'Venda'},{key:'atraso',label:'2ª Parc. Atraso'},{key:'pct',label:'%',percent:true}
      ]},

function flatCols(template){
  const out = [];
  TEMPLATES[template].groups.forEach(g => g.cols.forEach(c => out.push({group:g.key, key:c.key})));
  return out;
}

const SUPERVISOR_STATE = {
  'renato':'Pernambuco', 'valeria':'Pernambuco', 'ana':'Pernambuco', 'hugo':'Pernambuco', 'laura':'Pernambuco',
  'danielly':'Bahia', 'paula':'Bahia', 'nielton':'Bahia', 'rayllana':'Bahia'
};
const STATE_COLORS = { 'Pernambuco':'#4C8FE0', 'Bahia':'#E8A93A' };

function inferState(supervisorName){
  const n = normalize(supervisorName);
  if(!n) return null;
  const tokens = n.split(/\s+/);
  for(const key of Object.keys(SUPERVISOR_STATE)){
    if(tokens.includes(key)) return SUPERVISOR_STATE[key];
  }
  return null;
}

function stateBadge(stateName){
  if(!stateName) return `<span class="state-badge" style="border-color:var(--line);color:var(--muted);"><span class="state-dot" style="background:var(--muted);"></span>Estado não identificado</span>`;
  const color = STATE_COLORS[stateName] || '#9AA0AC';
  return `<span class="state-badge" style="border-color:${color}66;color:${color};"><span class="state-dot" style="background:${color};"></span>${escapeHtml(stateName)}</span>`;
}

let state = {
  view: 'loading',
  registry: { teams: [], datasets: [] },
  datasets: {},
  index: [],
  query: '',
  searchMode: 'colaborador',
  selectedName: null,
  selectedMonthKey: null,
  teamSearch: { query:'', selectedTeamId:null, selectedMonthKey:null, sortCol:null, sortDir:'desc' },
  adminUnlocked: false,
  admin: { teamId:'', monthKey:'', monthLabel:'', pasteText:'', preview:null, error:'', ok:'', newTeamName:'', newTeamTemplate:'padrao', diagnostic:null, _strippedCount:0, loginEmail:'', loginPassword:'', loginError:'' }
};

function $(sel){ return document.querySelector(sel); }
function app(){ return document.getElementById('app'); }

function normalize(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}

async function getDocData(collection, id){
  const snap = await db.collection(collection).doc(id).get();
  return snap.exists ? snap.data() : null;
}
async function setDocData(collection, id, data){
  await db.collection(collection).doc(id).set(data);
}
async function deleteDocData(collection, id){
  await db.collection(collection).doc(id).delete();
}

async function loadAll(){
  state.view = 'loading';
  render();
  try{
    const reg = await getDocData('app', 'registry');
    state.registry = reg || { teams: [], datasets: [] };
  }catch(e){ state.registry = { teams: [], datasets: [] }; }

  state.datasets = {};
  for(const d of state.registry.datasets){
    try{
      const ds = await getDocData('datasets', d.teamId+'_'+d.monthKey);
      if(ds) state.datasets[d.teamId+'::'+d.monthKey] = ds;
    }catch(e){ /* skip missing */ }
  }
  buildIndex();
  state.view = 'search';
  render();
}

function buildIndex(){
  const idx = [];
  for(const d of state.registry.datasets){
    const ds = state.datasets[d.teamId+'::'+d.monthKey];
    if(!ds) continue;
    const team = state.registry.teams.find(t => t.id === d.teamId);
    if(!team) continue;
    ds.rows.forEach(row => {
      idx.push({
        name: row.name,
        norm: normalize(row.name),
        teamId: team.id,
        teamName: team.name,
        state: team.state || null,
        template: team.template,
        supervisor: ds.supervisor ? ds.supervisor.name : '',
        monthKey: d.monthKey,
        monthLabel: d.monthLabel,
        updatedAt: ds.updatedAt,
        vacation: !!row.vacation,
        values: row.values
      });
    });
  }
  state.index = idx;
}

function uniqueNamesMatching(q){
  const nq = normalize(q);
  if(!nq) return [];
  const namesSeen = new Set();
  state.index.forEach(r => { if(r.norm.includes(nq)) namesSeen.add(r.name); });
  return Array.from(namesSeen).slice(0,8).map(name => recordsFor(name)[0]);
}

function recordsFor(name){
  return state.index.filter(r => r.name === name).sort((a,b) => b.monthKey.localeCompare(a.monthKey));
}

function teamDatasetsFor(teamId){
  return state.registry.datasets
    .filter(d => d.teamId === teamId)
    .slice()
    .sort((a,b) => b.monthKey.localeCompare(a.monthKey));
}

function latestSupervisorForTeam(teamId){
  const dsEntries = teamDatasetsFor(teamId);
  for(const d of dsEntries){
    const ds = state.datasets[teamId+'::'+d.monthKey];
    if(ds && ds.supervisor) return ds.supervisor.name;
  }
  return '';
}

function matchingTeams(q){
  const nq = normalize(q);
  if(!nq) return state.registry.teams.map(t => ({ team: t, supervisor: latestSupervisorForTeam(t.id) }));
  return state.registry.teams
    .filter(t => normalize(t.name).includes(nq) || normalize(latestSupervisorForTeam(t.id)).includes(nq))
    .slice(0,8)
    .map(t => ({ team: t, supervisor: latestSupervisorForTeam(t.id) }));
}

function parseNum(v){
  if(v === undefined || v === null) return NaN;
  const s = v.toString().trim().replace('%','').replace(',', '.');
  if(s === '' || s === '-') return NaN;
  const n = parseFloat(s);
  return isNaN(n) ? NaN : n;
}

function statClass(groupKey, colKey, value, rowContext){
  if(!value && value !== 0) return '';
  const n = parseNum(value);
  if(isNaN(n)) return '';
  if(groupKey === 'cancelamento'){
    if(rowContext){
      const metaN = parseNum(rowContext.metaVal);
      const realN = parseNum(rowContext.realVal);
      if(!isNaN(metaN) && !isNaN(realN)){
        return realN < metaN ? 'good' : 'bad';
      }
    }
    return n <= 0 ? 'good' : 'bad';
  }
  if(groupKey === 'adimplencia'){
    if(rowContext){
      const metaN = parseNum(rowContext.metaVal);
      if(!isNaN(metaN)){
        return n >= metaN ? 'good' : 'bad';
      }
    }
    return n >= 100 ? 'good' : 'bad';
  }
  return n >= 100 ? 'good' : 'bad';
}

function renderYearMonthGrid(dsEntries, selectedMonthKey){
  const byYear = new Map();
  dsEntries.forEach(d => {
    const year = d.monthKey.slice(0,4);
    const month = parseInt(d.monthKey.slice(5,7),10);
    if(!byYear.has(year)) byYear.set(year, new Map());
    byYear.get(year).set(month, d);
  });
  const years = Array.from(byYear.keys()).sort((a,b) => b.localeCompare(a));
  return years.map(year => {
    const monthsMap = byYear.get(year);
    const row = (fromM, toM) => {
      const cells = [];
      for(let m=fromM; m<=toM; m++){
        const d = monthsMap.get(m);
        if(!d){ cells.push(`<div class="month-cell empty"></div>`); continue; }
        cells.push(`<div class="month-cell"><button class="${d.monthKey===selectedMonthKey?'active':''}" onclick="selectTeamMonth('${d.monthKey}')">${escapeHtml(d.monthLabel)}</button></div>`);
      }
      return `<div class="month-grid">${cells.join('')}</div>`;
    };
    return `<div class="year-block">
      <div class="year-label">${escapeHtml(year)}</div>
      ${row(1,6)}
      ${row(7,12)}
    </div>`;
  }).join('');
}

function renderTeamDashboard(){
  const teamId = state.teamSearch.selectedTeamId;
  const team = state.registry.teams.find(t => t.id === teamId);
  if(!team){ state.view='search'; state.searchMode='equipe'; render(); return; }
  const dsEntries = teamDatasetsFor(teamId);
  const monthKey = state.teamSearch.selectedMonthKey || (dsEntries[0] && dsEntries[0].monthKey);
  const dsMeta = dsEntries.find(d => d.monthKey === monthKey) || dsEntries[0];
  const ds = state.datasets[teamId+'::'+monthKey];
  if(!ds || !dsMeta){
    app().innerHTML = `${topbar(false)}<button class="back-btn" onclick="goSearch()">← Voltar</button><div class="empty-state">Sem dados importados para esta equipe ainda.</div>`;
    return;
  }
  const tmpl = TEMPLATES[team.template];
  const cols = flatCols(team.template);

  // ---- Totais da equipe (linha do supervisor) ----
  const totalsHtml = tmpl.groups.map(g => {
    const metaColIndex = cols.findIndex(fc => fc.group === g.key && fc.key === 'meta');
    const realColIndex = cols.findIndex(fc => fc.group === g.key && fc.key === 'real');
    const metaVal = metaColIndex >= 0 ? ds.supervisor.values[metaColIndex] : undefined;
    const realVal = realColIndex >= 0 ? ds.supervisor.values[realColIndex] : undefined;
    const statsHtml = g.cols.map(c => {
      const flatIndex = cols.findIndex(fc => fc.group === g.key && fc.key === c.key);
      const val = ds.supervisor.values[flatIndex];
      const cls = c.percent ? statClass(g.key, c.key, val, { metaVal, realVal }) : '';
      return `<div class="stat">
        <div class="slabel">${escapeHtml(c.label)}</div>
        <div class="sval ${cls}">${val === undefined || val === '' ? '—' : escapeHtml(val)}</div>
      </div>`;
    }).join('');
    return `<div class="group">
      <div class="group-title">${escapeHtml(g.label)}</div>
      <div class="group-rows">${statsHtml}</div>
    </div>`;
  }).join('');

  // ---- Colunas de "%" (uma por grupo) para a tabela comparativa e para os insights ----
  const pctGroups = tmpl.groups.map(g => {
    const pctCol = g.cols.find(c => c.percent);
    const flatIndex = cols.findIndex(fc => fc.group === g.key && fc.key === pctCol.key);
    const metaColIndex = cols.findIndex(fc => fc.group === g.key && fc.key === 'meta');
    const realColIndex = cols.findIndex(fc => fc.group === g.key && fc.key === 'real');
    return { key: g.key, label: g.label, flatIndex, metaColIndex, realColIndex };
  });

  const rowsData = ds.rows.map(r => {
    if(r.vacation){
      return { name: r.name, vacation: true, perGroup: null };
    }
    const perGroup = {};
    pctGroups.forEach(pg => {
      const val = r.values[pg.flatIndex];
      const metaVal = pg.metaColIndex >= 0 ? r.values[pg.metaColIndex] : undefined;
      const realVal = pg.realColIndex >= 0 ? r.values[pg.realColIndex] : undefined;
      perGroup[pg.key] = { val, cls: statClass(pg.key, 'pct', val, { metaVal, realVal }), n: parseNum(val) };
    });
    return { name: r.name, vacation: false, perGroup };
  });

  // ---- Insights rápidos (vendedores de férias não entram na contagem) ----
  const insightsHtml = pctGroups.map(pg => {
    const active = rowsData.filter(r => !r.vacation);
    const good = active.filter(r => r.perGroup[pg.key].cls === 'good').length;
    const total = active.filter(r => r.perGroup[pg.key].cls !== '').length;
    if(total === 0) return '';
    const cls = good === total ? 'good' : (good === 0 ? 'bad' : '');
    return `<div class="insight-row">
      <span class="ilabel">${escapeHtml(pg.label)}: dentro da meta</span>
      <span class="insight-count ${cls}">${good} de ${total}</span>
    </div>`;
  }).join('');

  // ---- Ordenação da tabela (vendedores de férias sempre por último) ----
  let sortedRows = rowsData.slice();
  if(state.teamSearch.sortCol){
    const sc = state.teamSearch.sortCol;
    sortedRows.sort((a,b) => {
      if(a.vacation && b.vacation) return 0;
      if(a.vacation) return 1;
      if(b.vacation) return -1;
      const av = sc === 'name' ? normalize(a.name) : a.perGroup[sc].n;
      const bv = sc === 'name' ? normalize(b.name) : b.perGroup[sc].n;
      const aBad = sc !== 'name' && isNaN(av), bBad = sc !== 'name' && isNaN(bv);
      if(aBad && bBad) return 0;
      if(aBad) return 1;
      if(bBad) return -1;
      if(av < bv) return state.teamSearch.sortDir === 'asc' ? -1 : 1;
      if(av > bv) return state.teamSearch.sortDir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  const tableHeaders = `
    <th class="${state.teamSearch.sortCol==='name'?'sorted':''}" onclick="sortTeamTable('name')">Vendedor</th>
    ${pctGroups.map(pg => `<th class="${state.teamSearch.sortCol===pg.key?'sorted':''}" onclick="sortTeamTable('${pg.key}')">${escapeHtml(pg.label)}</th>`).join('')}
  `;
  const tableRows = sortedRows.map(r => {
    if(r.vacation){
      return `<tr>
        <td class="name-cell" style="opacity:.5;" onclick="goToProfileFromTeam('${escapeAttr(r.name)}')">${escapeHtml(r.name)}</td>
        <td colspan="${pctGroups.length}" style="opacity:.7;"><span class="vacation-tag">Férias</span></td>
      </tr>`;
    }
    return `<tr>
      <td class="name-cell" onclick="goToProfileFromTeam('${escapeAttr(r.name)}')">${escapeHtml(r.name)}</td>
      ${pctGroups.map(pg => `<td class="pctcell ${r.perGroup[pg.key].cls}">${r.perGroup[pg.key].val === undefined || r.perGroup[pg.key].val === '' ? '—' : escapeHtml(r.perGroup[pg.key].val)}</td>`).join('')}
    </tr>`;
  }).join('');
  const totalsRow = `
    <tr class="totals-row">
      <td>TOTAL (${escapeHtml(ds.supervisor.name)})</td>
      ${pctGroups.map(pg => `<td>${ds.supervisor.values[pg.flatIndex] || '—'}</td>`).join('')}
    </tr>`;

  const monthGridHtml = renderYearMonthGrid(dsEntries, monthKey);

  const updated = ds.updatedAt ? new Date(ds.updatedAt).toLocaleString('pt-BR') : '—';

  app().innerHTML = `
    ${topbar(true)}
    <button class="back-btn" onclick="backToTeamList()">← Voltar às equipes</button>
    <div class="profile-header">
      <p class="pname">${escapeHtml(team.name)}</p>
      <div class="profile-meta">
        ${stateBadge(team.state)}
        <span class="chip">Supervisor(a): <b>${escapeHtml(ds.supervisor.name)}</b></span>
        <span class="chip">${ds.rows.length} vendedores</span>
      </div>
    </div>
    ${monthGridHtml}
    <div class="updated-note">Atualizado em ${updated}</div>

    <div class="panel">
      <h3>Totais da equipe</h3>
      ${totalsHtml}
    </div>

    <div class="panel">
      <h3>Panorama rápido</h3>
      <div class="insights">${insightsHtml}</div>
    </div>

    <div class="panel">
      <h3>Comparativo entre vendedores</h3>
      <p class="hint" style="margin-bottom:10px;">Clique no cabeçalho de uma coluna para ordenar. Clique no nome do vendedor para abrir o perfil completo.</p>
      <div class="team-table-wrap">
        <table class="team-table">
          <thead><tr>${tableHeaders}</tr></thead>
          <tbody>${tableRows}${totalsRow}</tbody>
        </table>
      </div>
    </div>
  `;
}

const MESES_ABBR = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
function monthKeyToLabel(monthKey){
  if(!monthKey || !/^\d{4}-\d{2}$/.test(monthKey)) return '';
  const [year, month] = monthKey.split('-');
  const idx = parseInt(month,10) - 1;
  if(idx < 0 || idx > 11) return '';
  return `${MESES_ABBR[idx]}/${year}`;
}

          <div class="di-meta">${ds ? ds.rows.length : 0} colaboradores · atualizado ${upd}</div>
        </div>
        <button class="btn small secondary" onclick="deleteDataset('${d.teamId}','${d.monthKey}')">Excluir</button>
      </div>`;
    }).join('')}</div>
  </details>`;

  const datasetList = (teamFolders + orphanFolder) || `<div class="hint">Nenhum dado importado ainda.</div>`;

  app().innerHTML = `
    ${topbar(false)}
    <p class="hint" style="margin-bottom:18px;">Área do administrador. Os colaboradores não têm acesso a esta tela.</p>

    <div class="panel">
      <h3>1. Equipes</h3>
      <div class="row-gap" style="align-items:flex-end;">
        <div class="field" style="flex:2;min-width:160px;">
          <label>Nome da equipe</label>
          <input id="newTeamName" type="text" placeholder="Ex: Petrolina Matriz" value="${escapeAttr(state.admin.newTeamName)}">
        </div>
        <div class="field" style="flex:1;min-width:140px;">
          <label>Formato</label>
          <select id="newTeamTemplate">
            <option value="padrao" ${state.admin.newTeamTemplate==='padrao'?'selected':''}>Padrão (Consórcio)</option>
            <option value="digital" ${state.admin.newTeamTemplate==='digital'?'selected':''}>Digital (Faturamento + Consórcio)</option>
          </select>
        </div>
        <button class="btn" onclick="addTeam()">Adicionar</button>
      </div>
    </div>

    <div class="panel">
      <h3>Equipes por estado</h3>
      <p class="hint" style="margin-bottom:14px;">O estado é detectado automaticamente pelo nome do supervisor assim que os dados são salvos. Corrija manualmente se necessário.</p>
      ${state.registry.teams.length === 0 ? `<div class="hint">Nenhuma equipe cadastrada ainda.</div>` : `
        ${['Pernambuco','Bahia',null].map(st => {
          const teamsInState = state.registry.teams.filter(t => (t.state||null) === st);
          if(teamsInState.length === 0) return '';
          return `<div style="margin-bottom:14px;">
            <div style="margin-bottom:8px;">${stateBadge(st)}</div>
            ${teamsInState.map(t => {
              const sup = latestSupervisorForTeam(t.id);
              const displayName = sup ? `${escapeHtml(sup)} — ${escapeHtml(t.name)}` : escapeHtml(t.name);
              return `
              <div class="dataset-item">
                <div>
                  <div class="di-name">${displayName}</div>
                  <div class="di-meta">${SHORT_TEMPLATE_LABEL[t.template]}</div>
                </div>
                <div class="row-gap" style="align-items:center;">
                  <select class="state-select" onchange="setTeamState('${t.id}', this.value)">
                    <option value="" ${!t.state?'selected':''}>Não identificado</option>
                    <option value="Pernambuco" ${t.state==='Pernambuco'?'selected':''}>Pernambuco</option>
                    <option value="Bahia" ${t.state==='Bahia'?'selected':''}>Bahia</option>
                  </select>
                  <button class="btn small secondary" onclick="deleteTeam('${t.id}')">Excluir equipe</button>
                </div>
              </div>
            `;
            }).join('')}
          </div>`;
        }).join('')}
      `}
    </div>

    <div class="panel">
      <h3>2. Importar dados do mês</h3>
      <div class="field">
        <label>Equipe</label>
        <select id="dsTeam">
          <option value="">Selecione...</option>
          ${teamOptions}
        </select>
      </div>
      <div class="row-gap">
        <div class="field" style="flex:1;min-width:150px;">
          <label>Mês/Ano</label>
          <input id="dsMonth" type="month" value="${escapeAttr(state.admin.monthKey)}">
        </div>
        <div class="field" style="flex:1;min-width:150px;">
          <label>Rótulo exibido (ex: SET/2026)</label>
          <input id="dsMonthLabel" type="text" placeholder="SET/2026" value="${escapeAttr(state.admin.monthLabel)}">
        </div>
      </div>
      <div class="field">
        <label>Colar linhas de dados do Excel (sem cabeçalho). A ÚLTIMA linha deve ser a do supervisor.</label>
        <textarea id="pasteArea" placeholder="Cole aqui as linhas copiadas do Excel...">${escapeHtml(state.admin.pasteText)}</textarea>
        <div class="hint">Copie no Excel apenas as linhas de vendedores + a linha final do supervisor, sem cabeçalhos. Colunas separadas por TAB.</div>
      </div>
      <div class="row-gap">
        <button class="btn secondary" onclick="previewPaste()">Pré-visualizar</button>
        <button class="btn" onclick="saveDataset()">Salvar dados</button>
      </div>
      ${state.admin.error ? `<div class="alert error" style="margin-top:12px;">${escapeHtml(state.admin.error)}</div>` : ''}
      ${state.admin.ok ? `<div class="alert ok" style="margin-top:12px;">${escapeHtml(state.admin.ok)}</div>` : ''}
      ${state.admin.diagnostic ? renderDiagnostic() : ''}
      ${state.admin.preview ? renderPreviewTable() : ''}
    </div>

    <div class="panel">
      <h3>3. Dados já importados</h3>
      ${datasetList}
    </div>

    <div class="panel">
      <h3>4. Sessão</h3>
      <p class="hint" style="margin-bottom:10px;">Conectado como <b>${escapeHtml(auth.currentUser ? auth.currentUser.email : '—')}</b></p>
      <button class="btn secondary" onclick="doLogout()">Sair</button>
    </div>
  `;

  const teamSel = $('#dsTeam'); if(teamSel){ teamSel.value = state.admin.teamId; teamSel.addEventListener('change', e => state.admin.teamId = e.target.value); }
  const monthInp = $('#dsMonth'); if(monthInp) monthInp.addEventListener('change', e => { state.admin.monthKey = e.target.value; state.admin.monthLabel = monthKeyToLabel(e.target.value); render(); });
  const monthLabelInp = $('#dsMonthLabel'); if(monthLabelInp) monthLabelInp.addEventListener('input', e => state.admin.monthLabel = e.target.value);
  const pasteArea = $('#pasteArea'); if(pasteArea) pasteArea.addEventListener('input', e => state.admin.pasteText = e.target.value);
  const newTeamNameInp = $('#newTeamName'); if(newTeamNameInp) newTeamNameInp.addEventListener('input', e => state.admin.newTeamName = e.target.value);
  const newTeamTplSel = $('#newTeamTemplate'); if(newTeamTplSel) newTeamTplSel.addEventListener('change', e => state.admin.newTeamTemplate = e.target.value);
}

function renderDiagnostic(){
  const d = state.admin.diagnostic;
  const rows = d.firstRowValues.map((v,i) => {
    const expectedLabel = d.expectedLabels[i] || '(a mais — sem coluna esperada aqui)';
    return `<tr><td>${i+1}</td><td>${escapeHtml(v===undefined||v===''?'(vazio)':v)}</td><td>${escapeHtml(expectedLabel)}</td></tr>`;
  }).join('');
  return `<div style="margin-top:12px;">
    <div class="hint" style="margin-bottom:8px;">Vendedor da 1ª linha: <b>${escapeHtml(d.firstRowName)}</b> — ${d.firstRowValues.length} valores encontrados, ${d.expectedCols} esperados.</div>
    <table class="preview"><thead><tr><th>#</th><th>Valor colado</th><th>Coluna esperada correspondente</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="hint" style="margin-top:8px;">As linhas cujo # ultrapassa o total esperado são as que sobram — geralmente colunas extras copiadas do Excel. Remova-as e cole novamente.</div>
  </div>`;
}

function renderPreviewTable(){
  const p = state.admin.preview;
  const team = state.registry.teams.find(t=>t.id===state.admin.teamId);
  const cols = flatCols(team.template);
  const header = ['Nome', ...cols.map(c => c.group+'.'+c.key)];
  const rows = [
    ...p.rows.map(r => r.vacation ? [r.name, `— Férias (${cols.length} colunas) —`] : [r.name,...r.values]),
    ['[SUPERVISOR] '+p.supervisor.name, ...p.supervisor.values]
  ];
  return `<table class="preview"><thead><tr>${header.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c===undefined?'':c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

async function setTeamState(teamId, value){
  const team = state.registry.teams.find(t=>t.id===teamId);
  if(!team) return;
  team.state = value || null;
  team.stateManual = true;
  await saveRegistry();
  buildIndex();
  render();
}

async function deleteTeam(teamId){
  const team = state.registry.teams.find(t=>t.id===teamId);
  if(!team) return;
  const relatedDatasets = state.registry.datasets.filter(d => d.teamId === teamId);
  const warning = relatedDatasets.length > 0
    ? `Excluir a equipe "${team.name}"? Isso também apaga os dados de ${relatedDatasets.length} mês(es) já importados para ela. Esta ação não pode ser desfeita.`
    : `Excluir a equipe "${team.name}"? Esta ação não pode ser desfeita.`;
  if(!confirm(warning)) return;

  for(const d of relatedDatasets){
    try{ await deleteDocData('datasets', teamId+'_'+d.monthKey); }catch(e){}
    delete state.datasets[teamId+'::'+d.monthKey];
  }
  state.registry.datasets = state.registry.datasets.filter(d => d.teamId !== teamId);
  state.registry.teams = state.registry.teams.filter(t => t.id !== teamId);
  if(state.admin.teamId === teamId) state.admin.teamId = '';
  await saveRegistry();
  buildIndex();
  state.admin.ok = `Equipe "${team.name}" excluída.`;
  render();
}

async function addTeam(){
  const name = (state.admin.newTeamName||'').trim();
  if(!name) return;
  const id = normalize(name).replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || ('team-'+Date.now());
  if(state.registry.teams.some(t=>t.id===id)){
    state.admin.error = 'Já existe uma equipe com esse nome.';
    render();
    return;
  }
  state.registry.teams.push({ id, name, template: state.admin.newTeamTemplate });
  await saveRegistry();
  state.admin.newTeamName = '';
  state.admin.error='';
  state.admin.ok = 'Equipe adicionada.';
  render();
}

function isVacationRowCells(cells){
  const valueCells = cells.slice(1).map(c => (c||'').trim()).filter(c => c !== '');
  if(valueCells.length === 0) return false;
  return valueCells.every(c => normalize(c) === 'ferias');
}

function parsePaste(){
  state.admin.error = '';
  state.admin.preview = null;
  state.admin.diagnostic = null;
  if(!state.admin.teamId){ state.admin.error = 'Selecione a equipe.'; return null; }
  if(!state.admin.monthKey){ state.admin.error = 'Selecione o mês.'; return null; }
  if(!state.admin.monthLabel.trim()){ state.admin.error = 'Informe o rótulo do mês (ex: SET/2026).'; return null; }
  const team = state.registry.teams.find(t=>t.id===state.admin.teamId);
  if(!team){ state.admin.error = 'Equipe inválida.'; return null; }
  const expectedCols = flatCols(team.template).length;
  const lines = state.admin.pasteText.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim()!=='');
  if(lines.length < 2){ state.admin.error = 'Cole ao menos uma linha de vendedor + a linha do supervisor.'; return null; }

  const rawRows = lines.map(l => l.split('\t').map(c=>c.trim()));
  const vacationFlags = rawRows.map(r => isVacationRowCells(r));

  const regularRows = rawRows.filter((r,i) => !vacationFlags[i]);
  if(regularRows.length === 0){ state.admin.error = 'Todas as linhas coladas estão marcadas como "Férias" — não sobrou nenhuma linha com dados, nem a do supervisor.'; return null; }
  const widths = regularRows.map(r => r.length);
  const maxWidth = Math.max(...widths);
  if(widths.some(w => w !== maxWidth)){
    state.admin.error = `As linhas coladas não têm todas o mesmo número de colunas (variando entre ${Math.min(...widths)} e ${maxWidth}). Confira se copiou o intervalo completo e retangular no Excel.`;
    return null;
  }

  const rawValWidth = maxWidth - 1;
  const regularValuesMatrix = regularRows.map(r => r.slice(1));

  function resolveKeepIndexes(){
    if(rawValWidth === expectedCols) return [...Array(rawValWidth).keys()];
    if(rawValWidth > expectedCols){
      const blankCols = [];
      for(let c=0; c<rawValWidth; c++){
        const allBlank = regularValuesMatrix.every(row => (row[c]||'').trim() === '');
        if(allBlank) blankCols.push(c);
      }
      const keep = [...Array(rawValWidth).keys()].filter(c => !blankCols.includes(c));
      if(keep.length === expectedCols){
        state.admin._strippedCount = blankCols.length;
        return keep;
      }
    }
    return null;
  }

  const keepIndexes = resolveKeepIndexes();
  if(!keepIndexes){
    state.admin.error = `A 1ª linha colada tem ${rawValWidth} valores, mas o formato "${TEMPLATES[team.template].label}" espera ${expectedCols}. Veja abaixo cada célula numerada da 1ª linha.`;
    state.admin.diagnostic = {
      expectedCols,
      expectedLabels: flatCols(team.template).map(c => c.group+'.'+c.key),
      firstRowName: regularRows[0][0],
      firstRowValues: regularValuesMatrix[0]
    };
    return null;
  }

  const rows = rawRows.map((r, i) => {
    if(vacationFlags[i]) return { name: r[0], vacation: true, values: [] };
    const cells = r.slice(1);
    return { name: r[0], vacation: false, values: keepIndexes.map(ci => cells[ci]) };
  });
  const supervisor = rows.pop();
  if(supervisor.vacation){
    state.admin.error = 'A última linha (supervisor) não pode estar marcada como "Férias". Verifique se colou a linha de totais corretamente.';
    return null;
  }
  return { rows, supervisor };
}

function previewPaste(){
  const result = parsePaste();
  if(result){ state.admin.preview = result; }
  render();
}

async function saveDataset(){
  const result = parsePaste();
  if(!result) { render(); return; }
  const teamId = state.admin.teamId, monthKey = state.admin.monthKey, monthLabel = state.admin.monthLabel.trim();
  const payload = { rows: result.rows, supervisor: result.supervisor, monthLabel, updatedAt: Date.now() };
  await setDocData('datasets', teamId+'_'+monthKey, payload);

  const exists = state.registry.datasets.some(d => d.teamId===teamId && d.monthKey===monthKey);
  if(!exists){
    state.registry.datasets.push({ teamId, monthKey, monthLabel });
  }
  const team = state.registry.teams.find(t=>t.id===teamId);
  if(team && !team.stateManual){
    const inferred = inferState(result.supervisor.name);
    if(inferred) team.state = inferred;
  }
  await saveRegistry();
  state.datasets[teamId+'::'+monthKey] = payload;
  buildIndex();
  state.admin.preview = null;
  state.admin.pasteText = '';
  state.admin.error = '';
  state.admin.diagnostic = null;
  const strippedNote = state.admin._strippedCount ? ` (${state.admin._strippedCount} colunas vazias foram ignoradas automaticamente)` : '';
  state.admin._strippedCount = 0;
  state.admin.ok = `Dados salvos: ${result.rows.length} colaboradores + supervisor(a) ${escapeHtml(result.supervisor.name)}${strippedNote}.`;
  render();
}

async function deleteDataset(teamId, monthKey){
  if(!confirm('Excluir este conjunto de dados?')) return;
  try{ await deleteDocData('datasets', teamId+'_'+monthKey); }catch(e){}
  state.registry.datasets = state.registry.datasets.filter(d => !(d.teamId===teamId && d.monthKey===monthKey));
  delete state.datasets[teamId+'::'+monthKey];
  await saveRegistry();
  buildIndex();
  render();
}

async function saveRegistry(){
  await setDocData('app', 'registry', state.registry);
}

function escapeHtml(s){
  return (s===undefined||s===null?'':s.toString()).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

window.selectPerson = selectPerson;
window.selectMonth = selectMonth;
window.goSearch = goSearch;
window.setSearchMode = setSearchMode;
window.selectTeam = selectTeam;
window.selectTeamMonth = selectTeamMonth;
window.sortTeamTable = sortTeamTable;
window.goToProfileFromTeam = goToProfileFromTeam;
window.backToTeamList = backToTeamList;
window.goAdmin = goAdmin;
window.doLogin = doLogin;
window.doLogout = doLogout;
window.addTeam = addTeam;
window.setTeamState = setTeamState;
window.deleteTeam = deleteTeam;
window.previewPaste = previewPaste;
window.saveDataset = saveDataset;
window.deleteDataset = deleteDataset;

if(firebaseReady){
  auth.onAuthStateChanged(user => {
    state.adminUnlocked = !!user;
    if(user && (state.view === 'adminLogin')){ state.view = 'admin'; }
    if(!user && state.view === 'admin'){ state.view = 'search'; }
    if(state.view !== 'loading') render();
  });
  loadAll();
} else {
  render();
}
</script>
