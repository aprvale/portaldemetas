<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070707">
<title>Pau Brasil Motos — Portal de Metas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--card:#141414;--line:#2a2a2a;--am:#f8bd03;--ok:#3ddc84;--ruim:#ff5a4f;--txt:#f4f1ea;--mut:#9c978d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,sans-serif;min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.marca{font-family:Anton;font-size:15px;letter-spacing:1px;color:var(--am)}
h1{font-family:Anton;font-size:32px;line-height:1;margin-top:4px;text-transform:uppercase}
.upd{font-family:'Bebas Neue';font-size:16px;letter-spacing:.5px;color:var(--mut);text-align:right;line-height:1.1}
.upd b{display:block;color:var(--txt);font-weight:normal;font-size:20px}
.sair{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:4px 9px;font-size:12px;margin-top:6px;cursor:pointer}
.tabs{display:flex;gap:6px;margin:14px 0 14px;background:#111;border:1px solid var(--line);border-radius:12px;padding:5px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font-family:'Bebas Neue';font-size:20px;letter-spacing:.5px;padding:9px 4px;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--am);color:#0a0a0a}
.login{margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.login h2{font-family:Anton;font-size:24px;text-transform:uppercase}
.login p{color:var(--mut);font-size:14px;margin:8px 0 16px;line-height:1.4}
.campo{width:100%;background:#0d0d0d;border:1px solid var(--line);border-radius:12px;color:var(--txt);font-size:22px;letter-spacing:4px;text-transform:uppercase;padding:13px 14px;font-family:'Bebas Neue'}
.btn{width:100%;margin-top:12px;background:var(--am);color:#0a0a0a;border:0;border-radius:12px;font-family:Anton;font-size:18px;padding:12px;cursor:pointer;text-transform:uppercase}
.erro{color:var(--ruim);font-size:14px;margin-top:10px;min-height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#1b1b1b;border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--txt)}
.chip.on{border-color:var(--am);color:var(--am)}
.sel{width:100%;background:#111;border:1px solid var(--line);border-radius:12px;color:var(--txt);font-size:16px;padding:12px;margin-bottom:12px}
.perfil{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.perfil .nome{font-family:Anton;font-size:24px;text-transform:uppercase;line-height:1.05}
.perfil .nome.verm{color:var(--ruim)}
.perfil .sub{color:var(--mut);font-size:13px;margin-top:4px}
.mes{display:inline-block;background:var(--am);color:#0a0a0a;font-family:Anton;font-size:15px;border-radius:7px;padding:3px 9px 2px;margin-top:10px}
.voltar{background:none;border:0;color:var(--am);font-family:'Bebas Neue';font-size:18px;cursor:pointer;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;position:relative;min-height:96px}
.kpi .n{font-family:'Bebas Neue';font-size:17px;letter-spacing:.5px;color:#bdb8ad}
.kpi .v{font-family:Anton;font-size:32px;line-height:1.05;margin-top:2px}
.kpi .d{font-family:'Bebas Neue';font-size:15px;color:var(--mut);letter-spacing:.3px}
.kpi.ok .v{color:var(--ok)}.kpi.ruim .v{color:var(--ruim)}
.kpi .tag{display:inline-block;margin-top:7px;font-family:'Bebas Neue';font-size:13px;background:#262626;color:var(--am);border-radius:5px;padding:2px 6px 1px}
.bar{height:7px;background:#2b2a25;border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--am)}
.kpi.ok .bar i{background:var(--ok)}
.sec{font-family:Anton;font-size:17px;color:var(--am);letter-spacing:.5px;margin:20px 0 10px;text-transform:uppercase}
.graf{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px 8px}
.graf svg{width:100%;height:auto;display:block}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin:6px 4px 0}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lista{background:#f3f3f3;color:#0a0a0a;border:4px solid var(--am);border-radius:16px;overflow:hidden}
.lh,.li{display:grid;grid-template-columns:1.7fr .8fr .8fr .8fr;align-items:center}
.lh{background:var(--am);font-family:Anton;font-size:13px;padding:9px 10px}
.lh div:not(:first-child),.li div:not(:first-child){text-align:center}
.li{padding:9px 10px;border-bottom:1px solid #dcdcdc;cursor:pointer;min-height:52px}.li:nth-child(even){background:#e9e9e9}
.li .nm{font-family:'Bebas Neue';font-size:19px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .nm.verm{color:#d6332a}.li .nm.aus{color:#8a8a8a}
.li .v{font-family:Anton;font-size:17px}.li .ok{color:#11924a}.li .ruim{color:#d6332a}
.li .s{font-family:'Bebas Neue';font-size:12px;color:#6b6b6b}
.li .ausente{grid-column:2/-1;text-align:center;font-family:Anton;font-size:14px;letter-spacing:3px;color:#777}
.farol .linha{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.farol .linha:last-child{border-bottom:0}
.farol .ind{font-family:'Bebas Neue';font-size:19px;letter-spacing:.3px}
.farol .grp{font-size:11px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase}
.farol .val{text-align:right;font-family:Anton;font-size:22px}
.farol .val small{display:block;font-family:'Bebas Neue';font-size:13px;color:var(--mut)}
.farol .ok{color:var(--ok)}.farol .ruim{color:var(--ruim)}.farol .parc{color:var(--am)}.farol .pend{color:var(--am);font-size:16px}
.pontos{display:flex;align-items:center;gap:14px}.anel{width:86px;height:86px;flex:none}
.nota{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.4}
.carregando{color:var(--mut);text-align:center;margin-top:60px}
.tabs.t4 button{font-size:17px}
.aviso{background:#2a2206;border:1px solid var(--am);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.4;margin-bottom:12px;cursor:pointer}
.aviso b{color:var(--am)}
.cods .campo{font-size:20px;margin-top:8px}
.cods .btn{font-size:16px;padding:10px}
.cods .lnk{background:none;border:0;color:var(--am);font-size:13px;cursor:pointer;padding:6px 0;text-decoration:underline}
.gl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.gl:last-child{border-bottom:0}
.gl .gn{font-family:'Bebas Neue';font-size:20px;line-height:1.05}
.gl .gs{font-size:12px;color:var(--mut);margin-top:2px}
.gl .gb{background:none;border:1px solid var(--am);color:var(--am);border-radius:9px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.gform{padding:0 0 12px;border-bottom:1px solid var(--line)}
.okmsg{color:var(--ok);font-size:14px;margin-top:10px;line-height:1.4}
.okmsg b{font-family:'Bebas Neue';font-size:24px;letter-spacing:3px;color:var(--txt)}
.tipo{display:inline-block;font-family:'Bebas Neue';font-size:12px;background:#262626;color:var(--mut);border-radius:5px;padding:1px 6px 0;margin-left:6px;vertical-align:2px}
</style>
</head>
<body>
<div class="app" id="app"><div class="carregando">Carregando…</div></div>
<script>
/* Portal de Metas — dados no Firestore, acesso por código (equipe ou líder).
   Os dados são gravados pelo programa "Atualizador Metas" (botão Atualizar site). */
const PROJETO="paubrasilmotos-metas", CHAVE_API="AIzaSyD84wl9o4AZMq7W35yJfVS_adxQFOXvHQE";
const BASE=`https://firestore.googleapis.com/v1/projects/${PROJETO}/databases/(default)/documents/`;
const MESES=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];

function dec(v){ if(!v) return null; const k=Object.keys(v)[0], x=v[k];
  switch(k){case"stringValue":case"booleanValue":case"timestampValue":return x;case"integerValue":return Number(x);case"doubleValue":return x;case"nullValue":return null;
  case"arrayValue":return (x.values||[]).map(dec);case"mapValue":{const o={};for(const [a,b] of Object.entries(x.fields||{}))o[a]=dec(b);return o}}return null}
async function ler(col,id){const r=await fetch(BASE+col+"/"+encodeURIComponent(id)+"?key="+CHAVE_API); if(r.status===404||r.status===403) return null; if(!r.ok) throw new Error("Falha ao ler ("+r.status+")"); const j=await r.json(); const o={}; for(const [a,b] of Object.entries(j.fields||{})) o[a]=dec(b); return o}
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const mem={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const curto=n=>{n=String(n||"");const p=n.split(/\s+/).filter(w=>!["DA","DE","DO","DOS","DAS","E"].includes(w));return n.length<=22||p.length<2?n:p[0]+" "+p[p.length-1]};
const classe=s=>s===1?"ok":s===-1?"ruim":"";

const E={acesso:null, dados:{}, tela:"equipe", equipe:null, mes:null, vend:null, farois:{}, farolSel:null, cod:{}};

const amplo=()=>E.acesso&&E.acesso.tipo!=="equipe";   // líder, gerente e admin veem o detalhe
async function entrar(codigo){
  const c=codigo.trim().toUpperCase(), h=await sha256(c);
  const a=await ler("acesso",h);
  if(!a) throw new Error("Código não encontrado. Confira com seu líder.");
  let perfil;
  if(a.p){ perfil=await ler("perfil",a.p);
    if(!perfil||perfil.cod!==h) throw new Error("Este código não vale mais. Peça o código atual ao seu líder.");
    perfil.p=a.p; perfil.h=h }
  else perfil=a;  // formato antigo
  E.acesso=perfil; mem.set("pm_codigo",c);
  const eqs=perfil.equipes||[]; E.equipe=eqs.length?eqs[0].id:null;
  if(perfil.tipo==="lider"&&perfil.farol){ E.tela="lider"; abrirFarol(perfil.farol) }
  else if((perfil.farois||[]).length){ E.farolSel=perfil.farois[0].k }
  if(amplo()&&perfil.p&&!perfil.em) E.tela="codigos";
  await carregarEquipe(E.equipe);
}
function abrirFarol(k){E.farolSel=k; if(E.farois[k]) return; E.farois[k]=null;
  ler("farol",k).then(f=>{E.farois[k]=f||{erro:1};if(E.tela==="lider")render()}).catch(()=>{E.farois[k]={erro:1};if(E.tela==="lider")render()})}
function eqInfo(id){return (E.acesso.equipes||[]).find(e=>e.id===id)}
async function carregarEquipe(id){
  if(!id||E.dados[id]) return;
  const e=eqInfo(id), det=amplo()&&e.d;
  const d=await ler(det?"detalhe":"resumo", det?e.d:e.r);
  E.dados[id]=d||{meses:{}};
}
function mesesDe(id){const d=E.dados[id];return d?Object.keys(d.meses||{}).sort():[]}

/* ---------- troca de códigos ---------- */
const DOC=(c,id)=>`projects/${PROJETO}/databases/(default)/documents/${c}/${id}`;
async function commit(writes){
  const r=await fetch(BASE.replace(/\/documents\/$/,"/documents:commit")+"?key="+CHAVE_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({writes})});
  if(r.ok) return; const j=await r.json().catch(()=>({})), st=(j.error&&j.error.status)||"";
  if(st==="ALREADY_EXISTS"||st==="FAILED_PRECONDITION"||r.status===409) throw new Error("Esse código não está disponível. Escolha outro.");
  if(st==="PERMISSION_DENIED"||r.status===403) throw new Error("Não foi possível trocar: seu acesso pode ter mudado. Saia e entre de novo.");
  throw new Error("Falha ao salvar ("+r.status+"). Tente de novo.");
}
function validarCodigo(c){c=c.trim().toUpperCase();
  if(!/^[A-Z0-9]{6,12}$/.test(c)) return "Use de 6 a 12 letras e números, sem espaços ou acentos.";
  if(!/[A-Z]/.test(c)||!/[0-9]/.test(c)) return "Misture letras e números (ex.: AGUIAS26).";
  return "";}
function sugerir(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";const r=crypto.getRandomValues(new Uint32Array(8));for(const x of r)c+=A[x%A.length];return /[0-9]/.test(c)&&/[A-Z]/.test(c)?c:sugerir()}
// troca o código do perfil p; "por" = hash do código de quem está trocando
async function trocarCodigo(p,codigo){
  const c=codigo.trim().toUpperCase(), novo=await sha256(c), alvo=await ler("perfil",p);
  if(!alvo||!alvo.cod) throw new Error("Perfil não encontrado.");
  if(alvo.cod===novo) throw new Error("Esse já é o código atual.");
  const rt=[{fieldPath:"em",setToServerValue:"REQUEST_TIME"}];
  await commit([
    {update:{name:DOC("troca",novo),fields:{p:{stringValue:p},por:{stringValue:E.acesso.h},c:{stringValue:c}}},updateTransforms:rt,currentDocument:{exists:false}},
    {update:{name:DOC("acesso",novo),fields:{p:{stringValue:p}}},currentDocument:{exists:false}},
    {update:{name:DOC("perfil",p),fields:{cod:{stringValue:novo}}},updateMask:{fieldPaths:["cod"]},updateTransforms:rt,currentDocument:{exists:true}},
    {delete:DOC("acesso",alvo.cod)}]);
  return {c,novo};
}
const dataBR=t=>t?new Date(t).toLocaleDateString("pt-BR")+" às "+new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
const ROT={equipe:"equipe",lider:"líder",gerente:"gerente",admin:"admin"};
function telaCodigos(){
  const a=E.acesso, g=a.gereInfo||[], C=E.cod;
  if(!C.carregado){C.carregado=true;C.st={};
    Promise.all(g.map(x=>ler("perfil",x.p).then(d=>{C.st[x.p]=d?(d.em?"Código criado em "+dataBR(d.em):"Código de 1º acesso ainda ativo"):"Ainda não publicado"}).catch(()=>{}))).then(()=>{if(E.tela==="codigos")render()})}
  const form=(id,rotulo,sug)=>`<div class="gform"><input class="campo" id="n_${id}" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="NOVO CÓDIGO" value="${esc(C["v_"+id]||"")}">
    ${sug?`<button class="lnk" data-sug="${id}">gerar um código aleatório</button>`:""}<button class="btn" data-salvar="${id}">${rotulo}</button>
    <div class="erro" id="e_${id}">${esc(C["e_"+id]||"")}</div>${C["ok_"+id]?`<div class="okmsg">${C["ok_"+id]}</div>`:""}</div>`;
  const ests=[...new Set(g.map(x=>x.estado||""))].sort();
  const grupo=st=>g.filter(x=>(x.estado||"")===st).sort((x,y)=>(x.t===y.t?0:x.t==="equipe"?-1:1)||x.n.localeCompare(y.n)).map(x=>`<div class="gl"><div><div class="gn">${esc(x.n)}<span class="tipo">${ROT[x.t]||""}</span></div><div class="gs">${esc(C.st&&C.st[x.p]||"…")}</div></div>
      <button class="gb" data-abrir="${x.p}">${C.aberto===x.p?"fechar":"novo código"}</button></div>${C.aberto===x.p?form(x.p,"Salvar código de "+esc(x.n),true):""}`).join("");
  return `<div class="perfil cods"><div class="nome">Seu código</div>
    <div class="sub">${a.em?"Criado por você em "+dataBR(a.em)+".":"Você está usando o código de primeiro acesso. Crie um código só seu — o de primeiro acesso deixa de funcionar."}</div>
    ${form("eu","Salvar meu código",false)}<p class="nota">6 a 12 letras e números, misturados. Não use datas, telefone ou o nome da equipe sozinho. O administrador guarda uma cópia dos códigos para o caso de esquecimento.</p></div>
    ${g.length?`<div class="sec">Códigos que você gerencia</div><div class="perfil cods">${ests.map(st=>(ests.length>1?`<div class="sec" style="margin:6px 0 0">${esc(st||"Sem estado")}</div>`:"")+grupo(st)).join("")}
    <p class="nota">Ao criar um código novo, o anterior para de funcionar na hora. Repasse o novo para a equipe ou o líder.</p></div>`:""}`;
}
function ligarCodigos(app){
  const C=E.cod;
  app.querySelectorAll("[data-abrir]").forEach(b=>b.onclick=()=>{C.aberto=C.aberto===b.dataset.abrir?null:b.dataset.abrir;render()});
  app.querySelectorAll("[data-sug]").forEach(b=>b.onclick=()=>{const id=b.dataset.sug;C["v_"+id]=sugerir();C["e_"+id]="";render()});
  app.querySelectorAll("input[id^=n_]").forEach(i=>i.oninput=()=>{C["v_"+i.id.slice(2)]=i.value});
  app.querySelectorAll("[data-salvar]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.salvar, eu=id==="eu", v=(document.getElementById("n_"+id).value||"").trim().toUpperCase(), er=document.getElementById("e_"+id);
    const msg=validarCodigo(v); if(msg){er.textContent=msg;return}
    if(eu&&!confirm("Seu novo código será "+v+". Guarde-o: o código atual vai parar de funcionar. Confirmar?")) return;
    b.disabled=true; er.textContent="Salvando…";
    try{ const r=await trocarCodigo(eu?E.acesso.p:id,v); C["v_"+id]=""; C["e_"+id]="";
      if(eu){E.acesso.h=r.novo;E.acesso.cod=r.novo;E.acesso.em=new Date().toISOString();mem.set("pm_codigo",r.c);C["ok_eu"]="Pronto! Seu novo código é <b>"+esc(r.c)+"</b>"}
      else{const x=(E.acesso.gereInfo||[]).find(y=>y.p===id);C.st[id]="Código criado em "+dataBR(new Date());
        C["ok_"+id]="Pronto! Novo código "+(x&&x.t==="equipe"?"da equipe":"de "+esc(x?x.n:""))+": <b>"+esc(r.c)+"</b><br>O código anterior já não funciona."}
      render();
    }catch(e){C["e_"+id]=e.message;b.disabled=false;er.textContent=e.message}
  });
}

/* ---------- telas ---------- */
function telaLogin(msg){
  document.getElementById("app").innerHTML=`<header><div><div class="marca">PAU BRASIL MOTOS</div><h1>Portal de Metas</h1></div></header>
  <div class="login"><h2>Digite seu código</h2><p>O código é da sua equipe (os líderes têm um código próprio). Peça ao seu líder se ainda não tiver.</p>
  <input class="campo" id="cod" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="••••••">
  <button class="btn" id="ent">Entrar</button><div class="erro" id="erro">${esc(msg||"")}</div></div>`;
  const go=async()=>{const c=document.getElementById("cod").value; if(!c.trim())return; document.getElementById("erro").textContent="Verificando…";
    try{await entrar(c); render()}catch(e){document.getElementById("erro").textContent=e.message}};
  document.getElementById("ent").onclick=go; document.getElementById("cod").onkeydown=e=>{if(e.key==="Enter")go()};
}
function cabecalho(){
  const d=E.dados[E.equipe]; const at=d&&d.atualizado?new Date(d.atualizado):null;
  const quando=at?at.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" às "+at.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"—";
  const a=E.acesso, rot={lider:"Líder: ",gerente:"",admin:""}[a.tipo];
  const temFarol=a.farol||(a.farois||[]).length, temCod=amplo()&&a.p;
  const tab=(t,n)=>`<button data-t="${t}" class="${E.tela===t?"on":""}">${n}</button>`;
  const n=1+2+(temFarol?1:0)+(temCod?1:0);
  return `<header><div><div class="marca">PAU BRASIL MOTOS</div><h1>Portal de Metas</h1></div>
  <div class="upd">ATUALIZADO EM<b>${quando}</b><button class="sair" id="sair">${rot!=null?esc(rot+a.nome)+" · sair":"Sair"}</button></div></header>
  <div class="tabs ${n>3?"t4":""}">${temFarol?tab("lider",a.farol?"Meu farol":"Faróis"):""}${tab("equipe","Equipe")}${tab("vend","Vendedor")}${temCod?tab("codigos","Códigos"):""}</div>
  ${temCod&&!a.em&&E.tela!=="codigos"?`<div class="aviso" data-t="codigos">Você entrou com um <b>código de primeiro acesso</b>. Toque aqui para criar o seu código pessoal.</div>`:""}`;
}
function kpis(m,linha){
  if(!linha||!linha.i) return "";
  return `<div class="grid">${m.g.map((g,k)=>{const x=linha.i[k]||{}; const bar=x.b!=null?`<div class="bar"><i style="width:${Math.min(x.b,1)*100}%"></i></div>`:"";
    const tag=g.t!=="volume"&&g.m?`<span class="tag">${esc(g.m.replace("META ","meta ").replace("ATÉ","até"))}</span>`:"";
    return `<div class="kpi ${classe(x.s)}"><div class="n">${esc(g.n)}</div><div class="v">${esc(x.p||"—")}</div><div class="d">${esc(x.d||(g.t==="volume"&&g.m?g.m.toLowerCase():""))}</div>${bar}${tag}</div>`}).join("")}</div>`;
}
function grafico(pontos,titulo){
  const ms=pontos.map(p=>p.k), W=440,H=170,pl=14,pb=22,pt=14;
  if(!ms.length) return "";
  const mx=Math.max(...pontos.map(p=>Math.max(p.c[0],p.c[1])),1)*1.15;
  const passo=(W-pl-20)/Math.max(ms.length-1,1), x=i=>pl+10+i*passo, y=v=>pt+(H-pt-pb)*(1-v/mx);
  let bars="",lin="",lab="";
  pontos.forEach((p,i)=>{const [meta,real]=p.c, bw=Math.min(22,passo*.6), c=real>=meta?"#3ddc84":"#ff5a4f";
    lab+=`<text x="${x(i)}" y="${H-6}" fill="#9c978d" font-size="10" text-anchor="middle" font-family="Bebas Neue">${MESES[+p.k.slice(5)-1]}</text>`;
    bars+=`<rect x="${x(i)-bw/2}" y="${y(real)}" width="${bw}" height="${Math.max(y(0)-y(real),0)}" rx="3" fill="${c}"><title>${real} de ${meta}</title></rect><text x="${x(i)}" y="${y(real)-3}" fill="#f4f1ea" font-size="10" text-anchor="middle" font-family="Bebas Neue">${Math.round(real*10)/10}</text>`;
    lin+=(lin?"L":"M")+(x(i)-passo/2)+" "+y(meta)+"L"+(x(i)+passo/2)+" "+y(meta)});
  return `<div class="sec">${esc(titulo)}</div><div class="graf"><svg viewBox="0 0 ${W} ${H}"><line x1="${pl}" x2="${W-6}" y1="${y(0)}" y2="${y(0)}" stroke="#2a2a2a"/>${bars}<path d="${lin}" fill="none" stroke="#bdb8ad" stroke-width="1.5" stroke-dasharray="4 3"/>${lab}</svg>
  <div class="leg"><span><i style="background:#3ddc84"></i>bateu a meta</span><span><i style="background:#ff5a4f"></i>abaixo</span><span><i style="border-top:2px dashed #bdb8ad;height:0;width:14px"></i>meta</span></div></div>`;
}
function serie(id,nome,total){
  const d=E.dados[id]; return mesesDe(id).map(k=>{const m=d.meses[k]; const l=total?m.t:(m.v||[]).find(v=>v.n===nome); return l&&l.c?{k,c:l.c}:null}).filter(Boolean);
}
function seletores(){
  const eqs=E.acesso.equipes||[], ms=mesesDe(E.equipe);
  let h="";
  const op=e=>`<option value="${esc(e.id)}" ${e.id===E.equipe?"selected":""}>${esc(e.nome)} — ${esc(e.sup)}</option>`;
  const ests=[...new Set(eqs.map(e=>e.estado||"Outras"))];
  if(eqs.length>1) h+=`<select class="sel" id="selEq">${ests.length>1?ests.map(st=>`<optgroup label="${esc(st)}">${eqs.filter(e=>(e.estado||"Outras")===st).map(op).join("")}</optgroup>`).join(""):eqs.map(op).join("")}</select>`;
  if(ms.length) h+=`<div class="chips">${ms.slice().reverse().map(k=>`<span class="chip ${k===E.mes?"on":""}" data-mes="${k}">${MESES[+k.slice(5)-1]}/${k.slice(2,4)}</span>`).join("")}</div>`;
  return h;
}
function telaEquipe(){
  const d=E.dados[E.equipe], e=eqInfo(E.equipe); const m=d&&d.meses[E.mes];
  if(!m) return seletores()+`<p class="nota">Ainda não há dados desta equipe.</p>`;
  const st=(x)=>x?classe(x.s):"";
  const idx=t=>m.g.findIndex(g=>g.t===t);
  const iC=m.g.findIndex(g=>g.n===m.s), iA=idx("adimplencia"), iX=idx("cancelamento");
  const ativos=(m.v||[]).filter(v=>!v.a).length;
  const linhas=(m.v||[]).map(v=>{const nm=`<div class="nm ${v.v?"verm":""} ${v.a?"aus":""}">${esc(curto(v.n))}</div>`;
    if(v.a) return `<div class="li">${nm}<div class="ausente">${esc(v.a)}</div></div>`;
    const c=v.i[iC]||{}, a=v.i[iA]||{}, x=v.i[iX]||{};
    return `<div class="li" data-v="${esc(v.n)}">${nm}<div><div class="v ${st(c)}">${esc(c.p||"—")}</div><div class="s">${esc(m.s.toLowerCase())}</div></div>
    <div><div class="v ${st(a)}">${esc(a.p||"—")}</div><div class="s">adimpl.</div></div><div><div class="v ${st(x)}">${esc(x.p||"—")}</div><div class="s">cancel.</div></div></div>`}).join("");
  return seletores()+`<div class="perfil"><div class="nome">${esc(e.nome)}</div><div class="sub">Supervisão ${esc(m.t.n)} · ${ativos} vendedores</div><span class="mes">${esc(m.r)}</span></div>
  ${kpis(m,m.t)}${grafico(serie(E.equipe,null,true),(m.s||"")+" da equipe mês a mês")}
  <div class="sec">Vendedores</div><div class="lista"><div class="lh"><div>VENDEDOR</div><div>${esc(m.s)}</div><div>ADIM.</div><div>CANC.</div></div>${linhas}</div>
  <p class="nota">Toque num vendedor para ver o detalhe e a evolução dele.${(m.v||[]).some(v=>v.v)?" Nome em vermelho: vendedor desligado com pendências.":""}</p>`;
}
function telaVend(){
  const d=E.dados[E.equipe], m=d&&d.meses[E.mes], e=eqInfo(E.equipe);
  if(!m) return seletores()+`<p class="nota">Ainda não há dados desta equipe.</p>`;
  const vs=(m.v||[]).filter(v=>!v.a);
  if(!E.vend||!vs.find(v=>v.n===E.vend)) E.vend=vs.length?vs[0].n:null;
  const v=vs.find(v=>v.n===E.vend);
  return seletores()+`<div class="chips">${vs.map(x=>`<span class="chip ${x.n===E.vend?"on":""}" data-v="${esc(x.n)}">${esc(curto(x.n))}</span>`).join("")}</div>
  ${v?`<div class="perfil"><div class="nome ${v.v?"verm":""}">${esc(v.n)}</div><div class="sub">${esc(e.nome)} · supervisão ${esc(m.t.n)}</div><span class="mes">${esc(m.r)}</span></div>
  ${kpis(m,v)}${grafico(serie(E.equipe,v.n,false),(m.s||"")+" mês a mês")}`:`<p class="nota">Nenhum vendedor ativo neste mês.</p>`}`;
}
function telaLider(){
  const lst=E.acesso.farois||[]; let topo="";
  if(!E.acesso.farol&&lst.length){ if(!E.farolSel) E.farolSel=lst[0].k; abrirFarol(E.farolSel);
    topo=`<div class="chips">${lst.map(x=>`<span class="chip ${x.k===E.farolSel?"on":""}" data-f="${esc(x.k)}">${esc(x.n)}</span>`).join("")}</div>` }
  const f=E.farois[E.farolSel];
  if(!f) return topo+`<p class="nota">Carregando o farol…</p>`;
  if(f.erro||!f.itens) return topo+`<p class="nota">Farol ainda não publicado.</p>`;
  return topo+telaFarol(f);
}
function telaFarol(f){
  const a=f.max?f.pontos/f.max:0, R=36, C=2*Math.PI*R;
  const it=(f.itens||[]).map(i=>{let v;
    if(i.pend) v=`<span class="pend">PENDENTE</span><small>sem dado no painel</small>`;
    else { const cls=i.s===1?"ok":i.s===0?"parc":"ruim"; v=`<span class="${cls}">${esc(i.real)}</span><small>meta ${esc(i.meta)}${i.aa?" · ano ant. "+esc(i.aa):""}</small>` }
    return `<div class="linha"><div><div class="grp">${esc(i.g)}</div><div class="ind">${esc(i.n)}</div><div class="grp">pontos ${String(i.pts).replace(".",",")} de ${String(i.peso).replace(".",",")}</div></div><div class="val">${v}</div></div>`}).join("");
  return `<div class="perfil"><div class="pontos"><svg class="anel" viewBox="0 0 90 90"><circle cx="45" cy="45" r="${R}" fill="none" stroke="#2b2a25" stroke-width="9"/><circle cx="45" cy="45" r="${R}" fill="none" stroke="#f8bd03" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*Math.min(a,1)} ${C}" transform="rotate(-90 45 45)"/><text x="45" y="51" text-anchor="middle" font-family="Anton" font-size="19" fill="#f4f1ea">${String(Math.round(f.pontos*100)/100).replace(".",",")}</text></svg>
  <div><div class="nome">Farol — ${esc(f.nome)}</div><div class="sub">Pontos no mês (de ${f.max}) · acumulado no ano: ${String(Math.round((f.pontosAc||0)*100)/100).replace(".",",")}</div><span class="mes">${esc(f.mes)}</span></div></div></div>
  <div class="perfil farol">${it}</div><p class="nota">Último mês fechado, lido do painel do líder. “Pendente” = indicador sem dado preenchido.</p>`;
}
function render(){
  const app=document.getElementById("app");
  if(!E.acesso){telaLogin();return}
  const ms=mesesDe(E.equipe); if(!E.mes||!ms.includes(E.mes)) E.mes=ms[ms.length-1]||null;
  const corpo=E.tela==="lider"?telaLider():E.tela==="vend"?telaVend():E.tela==="codigos"?telaCodigos():telaEquipe();
  app.innerHTML=cabecalho()+corpo;
  app.querySelectorAll(".tabs button,.aviso[data-t]").forEach(b=>b.onclick=()=>{E.tela=b.dataset.t;render();scrollTo(0,0)});
  app.querySelectorAll("[data-f]").forEach(c=>c.onclick=()=>{abrirFarol(c.dataset.f);render()});
  if(E.tela==="codigos") ligarCodigos(app);
  const s=document.getElementById("sair"); if(s) s.onclick=()=>{mem.del("pm_codigo");Object.assign(E,{acesso:null,dados:{},farois:{},farolSel:null,vend:null,cod:{},tela:"equipe"});telaLogin()};
  const se=document.getElementById("selEq"); if(se) se.onchange=async()=>{E.equipe=se.value;E.mes=null;E.vend=null;app.querySelector(".perfil")&&(app.querySelector(".perfil").style.opacity=.5);await carregarEquipe(E.equipe);render()};
  app.querySelectorAll("[data-mes]").forEach(c=>c.onclick=()=>{E.mes=c.dataset.mes;render()});
  app.querySelectorAll("[data-v]").forEach(c=>c.onclick=()=>{E.vend=c.dataset.v;E.tela="vend";render();scrollTo(0,0)});
}
(async()=>{const c=mem.get("pm_codigo"); if(c){try{await entrar(c)}catch(e){mem.del("pm_codigo");telaLogin(e.message.startsWith("Falha")?"":"Seu código salvo não vale mais (pode ter sido trocado). Digite o código atual.");return}} render()})();
</script>
